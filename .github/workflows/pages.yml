# Publishes the static site in pages/ to GitHub Pages.
#
# One-time setup: in the repository settings, under Pages, set "Source" to "GitHub Actions". After
# that every push to main that touches pages/ redeploys the site, and the "Run workflow" button
# deploys it on demand.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['pages/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
