name: Release

# Builds and publishes a GitHub Release whenever a version tag (e.g. v2.3.0) is
# pushed. The tag must match the "version" field in package.json.
#
# Produces the same asset naming convention as past manual releases:
#   warewoolf_<version>_amd64.deb
#   warewoolf_<version>_arm64.deb
#   warewoolf_<version>_MacOS_Intel.dmg
#   warewoolf_<version>_MacOS_AppleSilicon.dmg
#   warewoolf_<version>_MacOS_Legacy.dmg
#   warewoolf_<version>_Windows_x64.exe
#   warewoolf_<version>_Windows_Portable_x64.zip
#
# The amd64/arm64/Windows_x64 substrings are load-bearing: the in-app updater
# (src/components/controllers/updates.js) picks the right asset by matching
# these substrings in the release asset filenames. The macOS Apple Silicon
# build is deliberately named "AppleSilicon" rather than "arm64" so it can't
# collide with that arm64 substring match (which today is Linux-only, but
# isn't guarded by platform) and get offered to Linux ARM users or vice versa.
#
# MacOS_Legacy is the same source packaged against a pinned Electron 32, the
# last line that runs on macOS 10.15 Catalina. Mainline Electron 44 needs
# macOS 13 Ventura, so this asset is what every mac between Catalina and 12
# Monterey updates along. Its name shares no substring with MacOS_Intel for
# exactly the reason AppleSilicon avoids arm64: the updater's match is a
# find() over includes(), so an overlapping name would be handed out on
# whatever order the GitHub API returned the assets in. Nothing here needs to
# run on an old mac - electron-forge only downloads a prebuilt Electron for
# the target and copies the app in, and this project has no native modules -
# so the minimum-OS floor comes from the pinned Electron, not the runner.
#
# The Windows asset is a Squirrel installer, which is what every manual release
# from v0.9.0 to v2.2.1 shipped: `npm run make` uses the maker-squirrel entry in
# package.json, and the resulting "Setup.exe" went up inside a .zip only because
# those uploads were done by hand. This workflow's first version read that .zip
# extension off the release page and reached for maker-zip, which produces
# something else entirely - the packaged app folder, no installer, no entry in
# Add/Remove Programs - under the same asset name. v2.3.0 through v2.5.0 shipped
# that way. The zip wrapper is gone with the manual upload that needed it, so the
# installer is now the asset itself.
#
# Windows_Portable_x64.zip is the second Windows asset, and is a deliberate one
# rather than a return of that accident: the packaged app folder, zipped under a
# name that says what it is, for writers who run WareWoolf off a USB stick or on
# a machine they cannot install software on. Two things separate it from what
# v2.3.0-v2.5.0 shipped. It is named "Portable" instead of impersonating the
# installer, and it unzips into a single WareWoolf_<version>_Portable folder
# instead of scattering ~200 loose files into whatever directory it was opened
# in - which is what maker-zip does here, since cross-zip calls .NET's
# CreateFromDirectory on the package folder and that puts its *contents* at the
# zip root. The zip is built by hand below for that reason; maker-zip is not
# used, and is not in package.json's makers list.
#
# It is a bin type of the updater's own, not just an extra file on the release
# page: a running copy reports which of the two Windows builds it is (Squirrel's
# Update.exe beside it, or not - see getPlatform in platform-node.js), and a
# portable copy is offered this zip where an installed one is offered the .exe.
# So the two names must each match exactly one asset, and the right one. The
# name avoids the "Windows_x64" substring for the same reason AppleSilicon
# avoids arm64 and MacOS_Legacy avoids MacOS_Intel: the updater's find() takes
# the first name that merely *includes* the bin type, so an overlap would hand
# whichever GitHub listed first to both kinds of writer. A step below asserts
# that against every bin type the updater knows.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v2.3.0)'
        required: true

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      tag: ${{ steps.get.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: get
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  linux:
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg
      - run: npm ci
      - run: npm run build
      - run: npx electron-forge make --platform=linux --arch=${{ matrix.arch }} --targets=@electron-forge/maker-deb
      # electron-installer-debian only passes dpkg-deb a -Z flag when `compression` is set in the
      # maker options; with none set it inherits dpkg-deb's own default, and Ubuntu patches that
      # default to zstd. dpkg 1.20 (Debian 11 Bullseye, Raspberry Pi OS Bullseye) cannot read a
      # zstd member and fails with "unknown compression for member 'control.tar.zst'" - so the deb
      # installed nowhere the README claims to support. package.json now pins compression to xz;
      # this checks the built artifact rather than trusting that, since the failure only shows up
      # on a machine none of the build matrix runs on.
      - name: Verify the deb uses compression older dpkg can read
        shell: bash
        run: |
          set -euo pipefail
          for deb in out/make/deb/${{ matrix.arch }}/*.deb; do
            members="$(ar t "$deb")"
            echo "$deb contains: $(echo "$members" | tr '\n' ' ')"
            if echo "$members" | grep -q 'zst$'; then
              echo "::error::$deb is zstd-compressed; Debian 11 / Raspberry Pi OS Bullseye cannot install it"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-linux-${{ matrix.arch }}
          path: out/make/deb/${{ matrix.arch }}/*.deb
          if-no-files-found: error

  macos:
    needs: check-version
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: x64
            label: MacOS_Intel
          - arch: arm64
            label: MacOS_AppleSilicon
          - arch: x64
            label: MacOS_Legacy
            electron: ^32.3.3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Swapped in after npm ci rather than pinned in package.json, so the legacy
      # build stays byte-for-byte the same source as the mainline one and there is
      # no second branch or lockfile to keep in step. --no-save leaves both files
      # untouched. Safe to do without a rebuild step because the project has no
      # native modules to relink against a different ABI.
      - name: Pin Electron for the legacy macOS build
        if: matrix.electron
        run: npm install --no-save "electron@${{ matrix.electron }}"
      - run: npm run build
      - run: npx electron-forge package --platform=darwin --arch=${{ matrix.arch }}
      # Checks the built artifact rather than trusting the pin above, the same way
      # the Linux job checks the deb's compression instead of trusting package.json.
      # Electron 32 stamps 10.15; every line from 33 on stamps 11 or higher, so a
      # silently un-pinned build fails here instead of shipping as a legacy asset
      # that will not launch on any of the machines it is named for.
      - name: Verify the legacy build still targets macOS 10.x
        if: matrix.electron
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find out -maxdepth 2 -name "*.app" -print -quit)
          MIN=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP_PATH/Contents/Info.plist")
          echo "$APP_PATH targets macOS $MIN"
          case "$MIN" in
            10.*) ;;
            *) echo "::error::Legacy build targets macOS $MIN, not 10.x - the Electron pin did not take"; exit 1 ;;
          esac
      - name: Build dmg with hdiutil
        shell: bash
        # @electron-forge/maker-dmg pulls in the unmaintained `appdmg` package
        # (an optional dependency with the native addon `fs-xattr`), which
        # routinely fails to build on GitHub's macOS runners. npm treats a
        # failed optional dependency as non-fatal, so `npm ci` succeeds but
        # appdmg silently ends up missing, and the maker fails at runtime.
        # hdiutil is built into macOS, so build the dmg directly with it.
        run: |
          set -euo pipefail
          APP_PATH=$(find out -maxdepth 2 -name "*.app" -print -quit)
          echo "Packaged app: $APP_PATH"
          STAGING="$(mktemp -d)/WareWoolf"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p out/make
          hdiutil create -volname "WareWoolf" -srcfolder "$STAGING" -ov -format UDZO \
            "out/make/warewoolf_${{ needs.check-version.outputs.version }}_${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-macos-${{ matrix.label }}
          path: out/make/warewoolf_*_${{ matrix.label }}.dmg
          if-no-files-found: error

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-forge make --platform=win32 --arch=x64 --targets=@electron-forge/maker-squirrel
      # Squirrel names it "warewoolf-<version> Setup.exe" - a space in the middle and the version
      # in a different shape from every other asset here. Renamed rather than configured through
      # the maker's own setupExe option, because that option would have to spell the version out
      # literally in package.json and there would then be two places to bump on every release.
      - shell: bash
        run: |
          f=$(ls out/make/squirrel.windows/x64/*Setup.exe)
          mv "$f" "out/make/squirrel.windows/x64/warewoolf_${{ needs.check-version.outputs.version }}_Windows_x64.exe"
      # Checks the artifact rather than trusting the --targets flag, the same way the Linux job
      # checks the deb's compression and the macOS job checks the legacy build's minimum OS. This
      # one exists because the failure it catches already happened: v2.3.0 through v2.5.0 shipped
      # maker-zip's packaged app folder under a name that had always meant an installer, and
      # nothing in the pipeline noticed for four releases. An installer is a PE binary and comes
      # with Squirrel's feed files beside it; a zipped app folder is neither.
      #
      # Also asserts the RELEASES line names the exact .nupkg being uploaded beside it - that file
      # must not be renamed (RELEASES references it by exact filename, and Squirrel looks for
      # whatever the line says), and this is the one place that would otherwise only fail on a
      # writer's machine, applying an update.
      - name: Verify the Windows asset is an installer
        shell: bash
        run: |
          set -euo pipefail
          dir="out/make/squirrel.windows/x64"
          exe="$dir/warewoolf_${{ needs.check-version.outputs.version }}_Windows_x64.exe"
          nupkg="$dir/warewoolf-${{ needs.check-version.outputs.version }}-full.nupkg"
          test -f "$exe"
          test -f "$dir/RELEASES"
          test -f "$nupkg"
          if [ "$(head -c 2 "$exe")" != "MZ" ]; then
            echo "::error::$exe is not a Windows executable - the Squirrel maker did not run"
            exit 1
          fi
          if ! grep -q " $(basename "$nupkg") " "$dir/RELEASES"; then
            echo "::error::RELEASES does not name $(basename "$nupkg") - Squirrel would look for a file that isn't there"
            exit 1
          fi
          echo "$exe is a PE binary, with RELEASES naming $(basename "$nupkg") beside it"
      # The packaged app folder electron-forge left behind for maker-squirrel to read, zipped as
      # the portable asset. Built from out/warewoolf-win32-x64 rather than by a second forge run
      # against maker-zip: the folder is already there, and maker-zip would produce a zip whose
      # root is the app's own ~200 files rather than a folder to drag somewhere.
      #
      # CreateFromDirectory is pointed at a staging directory holding one folder, so that folder -
      # not its contents - is what the zip root holds. It is .NET's own, present on any runner,
      # rather than 7-Zip or Compress-Archive.
      - name: Build the portable Windows zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.check-version.outputs.version }}'
          $packaged = 'out/warewoolf-win32-x64'
          if (-not (Test-Path $packaged)) {
            Write-Output "::error::$packaged is missing - electron-forge did not leave a packaged app to zip"
            exit 1
          }

          $staging = Join-Path $env:RUNNER_TEMP 'portable-staging'
          $folder = Join-Path $staging "WareWoolf_${version}_Portable"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item -Recurse -Force "$packaged/*" $folder

          # The portable build has no Squirrel beside it, so the in-app updater's install-in-place
          # path cannot work for these writers: it fails, and the About panel drops them onto its
          # own fallback of downloading the installer. That is a reasonable place to land but a
          # confusing one to arrive at unwarned, so the folder says so up front.
          #
          # Written as an array rather than a PowerShell here-string: a here-string's closing "@
          # has to sit at column 0, and a column-0 line ends the YAML block scalar this whole
          # script lives in.
          $readme = @(
            "WareWoolf $version - portable build for Windows (64-bit)",
            "",
            "This is the whole application in one folder. Nothing is installed: put the",
            "folder wherever you like - a USB stick, a Documents folder, a machine you",
            "cannot install software on - and run warewoolf.exe inside it. Delete the",
            "folder to remove it.",
            "",
            "Your projects are yours and live wherever you save them. WareWoolf's own",
            "settings still live in your Windows user profile, not in this folder, so a",
            "copy carried to another machine starts with default settings.",
            "",
            "Updates: Help > About > Check For Updates works here and knows this is",
            "the portable build. Download gives you the next portable zip, not the",
            "installer. Unzip it and replace this folder with the one inside - that is",
            "the whole update. Releases are also at:",
            "",
            "  https://github.com/brsloan/warewoolf/releases"
          )
          Set-Content -Path (Join-Path $folder 'READ ME - Portable.txt') -Value $readme -Encoding utf8

          # Written beside the installer, RELEASES and the .nupkg rather than into a folder of its
          # own. upload-artifact roots a multi-path artifact at the least common ancestor of its
          # paths: with every Windows file in this one directory the artifact stays flat, as it was
          # before the zip existed, and the release job's non-recursive artifacts/* glob finds them.
          # A second directory would move that ancestor up to out/make, nest all four files under
          # subfolders, and drop every Windows asset from the release without a failure.
          $zip = "out/make/squirrel.windows/x64/warewoolf_${version}_Windows_Portable_x64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          # .NET Framework needed this loaded by hand; on the .NET that pwsh 7 runs, ZipFile is
          # already there and the facade may or may not resolve by name. Either outcome is fine,
          # so a failure here is not one worth stopping the release over - the CreateFromDirectory
          # call below is what actually has to work.
          try { Add-Type -AssemblyName System.IO.Compression.FileSystem } catch {}
          [IO.Compression.ZipFile]::CreateFromDirectory(
            $staging,
            (Join-Path $PWD $zip),
            [IO.Compression.CompressionLevel]::Optimal,
            $false)
          Write-Output "Built $zip"
      # Checks the artifact rather than trusting the step above, the same way every other platform
      # here checks its own. Three failures are worth catching, and all three would otherwise only
      # show up on a writer's machine, after the release.
      #
      # Separators first: the zip spec says entry names use forward slashes, and .NET Framework's
      # CreateFromDirectory famously wrote backslashes instead - a bug fixed in .NET Core, which is
      # what the pwsh above runs on. A zip carrying backslash names extracts as one file per
      # directory with a literal backslash in its name under many tools, so it is checked rather
      # than assumed from the shell the step declares.
      #
      # Then the layout: a zip whose root is the app's own files scatters them into whatever
      # directory the writer opened it in. Then the contents: the folder has to be a WareWoolf
      # that runs, not just a folder.
      - name: Verify the portable zip unpacks into one folder with the app in it
        shell: bash
        run: |
          set -euo pipefail
          zip="out/make/squirrel.windows/x64/warewoolf_${{ needs.check-version.outputs.version }}_Windows_Portable_x64.zip"
          folder="WareWoolf_${{ needs.check-version.outputs.version }}_Portable"
          test -f "$zip"
          entries="$(unzip -Z1 "$zip")"
          if echo "$entries" | grep -q '\\'; then
            echo "::error::$zip has backslashes in its entry names; many extractors will unpack it as a heap of oddly-named files"
            echo "$entries" | grep '\\' | head -5
            exit 1
          fi
          roots="$(echo "$entries" | cut -d/ -f1 | sort -u)"
          if [ "$roots" != "$folder" ]; then
            echo "::error::$zip does not unpack into a single $folder directory; its root holds $(echo "$roots" | wc -l) entries, starting with:"
            echo "$roots" | head -5
            exit 1
          fi
          for required in "$folder/warewoolf.exe" "$folder/resources/app/src/index.js"; do
            if ! echo "$entries" | grep -qxF "$required"; then
              echo "::error::$zip is missing $required - this is not a runnable portable build"
              exit 1
            fi
          done
          echo "$zip unpacks into $folder/ with warewoolf.exe inside"
      # None of the Windows assets that are not the installer - RELEASES, warewoolf-<version>-full
      # .nupkg, the portable zip - may contain amd64/arm64/Windows_x64/
      # MacOS_Intel/MacOS_AppleSilicon/MacOS_Legacy - extractUpdateDownloadInfo
      # (src/components/controllers/updates.js) matches a release asset to this platform/arch by
      # bin.name.includes(binType) over a find(), so an asset whose name happened to contain one of
      # those substrings could be handed to the wrong platform, or shadow the real installer,
      # depending on asset ordering. This is the same hazard the macOS job's AppleSilicon/
      # MacOS_Legacy naming already avoids; checked here so a future asset name is caught before it
      # ships rather than discovered on a writer's machine.
      - name: Verify each Windows bin type matches exactly one asset
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check-version.outputs.version }}"
          # Every file this job uploads. extractUpdateDownloadInfo runs its find() over the whole
          # release, so the question is not whether each asset looks right on its own but which one
          # each bin type lands on when they sit side by side - which is what the loop below asks.
          names=(RELEASES
                 "warewoolf-${version}-full.nupkg"
                 "warewoolf_${version}_Windows_x64.exe"
                 "warewoolf_${version}_Windows_Portable_x64.zip")
          # Every bin type the updater can ask for, not just this platform's: an asset here carrying
          # a linux or mac substring would be offered to those writers instead of their own build.
          # Windows_Portable_x64 is the portable build's, added when the portable asset was.
          for binType in amd64 arm64 Windows_x64 Windows_Portable_x64 \
                         MacOS_Intel MacOS_AppleSilicon MacOS_Legacy; do
            matches=()
            for name in "${names[@]}"; do
              if [[ "$name" == *"$binType"* ]]; then
                matches+=("$name")
              fi
            done

            case "$binType" in
              # The two Windows bin types must each land on exactly one asset, and on the right one.
              # More than one match means asset ordering decides what a writer is handed; the wrong
              # one means an installed copy is offered a zip it cannot install, or a portable copy an
              # installer that would leave its folder stale somewhere on disk.
              Windows_x64)          expected="warewoolf_${version}_Windows_x64.exe" ;;
              Windows_Portable_x64) expected="warewoolf_${version}_Windows_Portable_x64.zip" ;;
              # Nothing this job uploads may match any other platform's bin type at all.
              *)                    expected="" ;;
            esac

            if [ "${#matches[@]}" -gt 1 ]; then
              echo "::error::$binType matches ${#matches[@]} Windows assets (${matches[*]}) - the updater's find() would pick whichever GitHub listed first"
              exit 1
            fi
            if [ "${matches[0]-}" != "$expected" ]; then
              echo "::error::$binType matches \"${matches[0]-<nothing>}\"; expected \"${expected:-<nothing>}\""
              exit 1
            fi
          done
          echo "Windows_x64 and Windows_Portable_x64 each match exactly their own asset, and nothing here matches another platform's"
      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-windows-x64
          path: |
            out/make/squirrel.windows/x64/warewoolf_*_Windows_x64.exe
            out/make/squirrel.windows/x64/warewoolf-*-full.nupkg
            out/make/squirrel.windows/x64/RELEASES
            out/make/squirrel.windows/x64/warewoolf_*_Windows_Portable_x64.zip
          if-no-files-found: error

  release:
    needs: [check-version, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          draft: true
          files: artifacts/*
