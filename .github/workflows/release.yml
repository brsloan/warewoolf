name: Release

# Builds and publishes a GitHub Release whenever a version tag (e.g. v2.3.0) is
# pushed. The tag must match the "version" field in package.json.
#
# Produces the same asset naming convention as past manual releases:
#   warewoolf_<version>_amd64.deb
#   warewoolf_<version>_arm64.deb
#   warewoolf_<version>_MacOS_Intel.dmg
#   warewoolf_<version>_MacOS_AppleSilicon.dmg
#   warewoolf_<version>_Windows_x64.zip
#
# The amd64/arm64/Windows_x64 substrings are load-bearing: the in-app updater
# (src/components/controllers/updates.js) picks the right asset by matching
# these substrings in the release asset filenames. The macOS Apple Silicon
# build is deliberately named "AppleSilicon" rather than "arm64" so it can't
# collide with that arm64 substring match (which today is Linux-only, but
# isn't guarded by platform) and get offered to Linux ARM users or vice versa.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v2.3.0)'
        required: true

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      tag: ${{ steps.get.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: get
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  linux:
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg
      - run: npm ci
      - run: npx electron-forge make --platform=linux --arch=${{ matrix.arch }} --targets=@electron-forge/maker-deb
      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-linux-${{ matrix.arch }}
          path: out/make/deb/${{ matrix.arch }}/*.deb
          if-no-files-found: error

  macos:
    needs: check-version
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: x64
            label: MacOS_Intel
          - arch: arm64
            label: MacOS_AppleSilicon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-forge package --platform=darwin --arch=${{ matrix.arch }}
      - name: Build dmg with hdiutil
        shell: bash
        # @electron-forge/maker-dmg pulls in the unmaintained `appdmg` package
        # (an optional dependency with the native addon `fs-xattr`), which
        # routinely fails to build on GitHub's macOS runners. npm treats a
        # failed optional dependency as non-fatal, so `npm ci` succeeds but
        # appdmg silently ends up missing, and the maker fails at runtime.
        # hdiutil is built into macOS, so build the dmg directly with it.
        run: |
          set -euo pipefail
          APP_PATH=$(find out -maxdepth 2 -name "*.app" -print -quit)
          echo "Packaged app: $APP_PATH"
          STAGING="$(mktemp -d)/WareWoolf"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p out/make
          hdiutil create -volname "WareWoolf" -srcfolder "$STAGING" -ov -format UDZO \
            "out/make/warewoolf_${{ needs.check-version.outputs.version }}_${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-macos-${{ matrix.arch }}
          path: out/make/warewoolf_*_${{ matrix.label }}.dmg
          if-no-files-found: error

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-forge make --platform=win32 --arch=x64 --targets=@electron-forge/maker-zip
      - shell: bash
        run: |
          f=$(ls out/make/zip/win32/x64/*.zip)
          mv "$f" "out/make/zip/win32/x64/warewoolf_${{ needs.check-version.outputs.version }}_Windows_x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-windows-x64
          path: out/make/zip/win32/x64/warewoolf_*_Windows_x64.zip
          if-no-files-found: error

  release:
    needs: [check-version, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          draft: true
          files: artifacts/*
